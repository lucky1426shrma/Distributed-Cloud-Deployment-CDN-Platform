<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CDN Test Page</title>

  <!-- Test CSS served through CDN -->
  <link
    rel="stylesheet"
    href="https://YOUR-CDN-DOMAIN/styles.css"
  />

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
    }

    .images {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    img {
      width: 250px;
      height: 160px;
      object-fit: cover;
      border-radius: 10px;
    }

    .status {
      padding: 15px;
      margin: 20px 0;
      background: #eee;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <h1>🚀 CDN Test Page</h1>

  <div class="status">
    <p>Testing whether assets are being served through my CDN.</p>
    <p id="js-status">JavaScript not loaded yet...</p>
  </div>

  <h2>Images</h2>

  <div class="images">
    <img
      src="https://YOUR-CDN-DOMAIN/images/image1.jpg"
      alt="CDN Test Image 1"
    />

    <img
      src="https://YOUR-CDN-DOMAIN/images/image2.jpg"
      alt="CDN Test Image 2"
    />

    <img
      src="https://YOUR-CDN-DOMAIN/images/image3.jpg"
      alt="CDN Test Image 3"
    />
  </div>

  <h2>Test JavaScript</h2>

  <button onclick="testCDN()">
    Test CDN
  </button>

  <!-- Test JS served through CDN -->
  <script src="https://YOUR-CDN-DOMAIN/script.js"></script>

  <script>
    function testCDN() {
      document.getElementById("js-status").innerText =
        "JavaScript is working! ✅";
    }
  </script>

</body>
</html>
